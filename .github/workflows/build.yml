name: Descomprimir y compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el ZIP del repositorio
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No hay ningún .zip en la raíz del repositorio"
            exit 1
          fi
          mkdir -p proyecto
          for z in "${zips[@]}"; do
            echo "Descomprimiendo $z"
            unzip -o -q "$z" -d proyecto
          done
          settings=$(find proyecto -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$settings" ]; then
            echo "::error::No se encontró settings.gradle.kts dentro del ZIP"
            find proyecto | head -50
            exit 1
          fi
          echo "PROJ=$(dirname "$settings")" >> "$GITHUB_ENV"
          echo "Proyecto en: $(dirname "$settings")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.7 instalado directamente (el proyecto no trae gradle-wrapper.jar)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar APK debug
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Ferrocarrilnaitor-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
